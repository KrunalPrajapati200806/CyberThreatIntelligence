services:
  cyberintel:
    build: .
    container_name: cyberintel-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberintel-frontend
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped